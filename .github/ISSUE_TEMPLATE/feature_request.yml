name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Murmel to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What do you use it for?
      description: The situation behind the idea helps to find the right solution.
