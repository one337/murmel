name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a run still in progress on the same branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Murmel targets the current GNOME stack (GTK 4.24, Libadwaita 1.10,
    # Go 1.27), which Fedora ships; Ubuntu's runner images are too old.
    container: fedora:45
    env:
      GOCACHE: /github/home/.cache/go-build
      GOMODCACHE: /github/home/go/pkg/mod
    steps:
      # git first, so checkout produces a real repository (verify.sh uses
      # git ls-files).
      - name: Install build dependencies
        run: >-
          dnf -y install --setopt=install_weak_deps=False
          git golang gcc gcc-c++ pkgconf-pkg-config
          gtk4-devel libadwaita-devel gobject-introspection-devel graphene-devel
          opus-devel webrtc-audio-processing-devel libsecret-devel
          glib2-devel gettext xorg-x11-server-Xvfb openssl dbus-daemon
          desktop-file-utils appstream
          mesa-dri-drivers mesa-libEGL mesa-libGL libglvnd-egl libglvnd-gles
          dejavu-sans-fonts adwaita-icon-theme

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The first build compiles the GTK bindings (several minutes); the
      # cache makes later runs fast.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/.cache/go-build
            /github/home/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ hashFiles('go.sum') }}-

      - name: Verify
        run: tools/verify.sh

      # After Verify, whose build leaves the compiled GTK bindings in the
      # Go build cache for the type check. Runs also when Verify failed.
      # Same version as GOLANGCI_LINT_VERSION in tools/verify.sh.
      - name: golangci-lint
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
