# Builds the snap for a pushed release tag and publishes it to the stable
# channel of the Snap Store, as Copr does for the RPM.
name: snap

on:
  push:
    tags: ['v[0-9]*']
    branches: [snap]
  # Manual start for a tag whose snap is missing (e.g. the store did not
  # answer during the release).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. v0.3.11'
        required: true

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      # Snapcraft builds from a copy without .git; the version is fixed
      # here, as tools/release.sh does for Flatpak builds.
      - name: Version
        run: tools/version.sh > build-version && cat build-version
      # The build installs LXD, Snapcraft and the build snaps from the Snap
      # Store, which at times does not answer GitHub's runners; up to three
      # attempts, a minute apart.
      - uses: snapcore/action-build@v1
        id: build1
        continue-on-error: true
      - if: steps.build1.outcome == 'failure'
        run: sleep 60
      - uses: snapcore/action-build@v1
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
      - if: steps.build2.outcome == 'failure'
        run: sleep 60
      - uses: snapcore/action-build@v1
        id: build3
        if: steps.build2.outcome == 'failure'
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build1.outputs.snap || steps.build2.outputs.snap || steps.build3.outputs.snap }}
          release: edge
