# Test builds of the snap (branch snap only; nothing is uploaded to the
# store). The .snap is kept as a workflow artifact for a few days.
name: snap

on:
  push:
    branches: [snap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Snapcraft builds from a copy without .git; the version is fixed
      # here, as tools/testbuild.sh does for Flatpak builds.
      - name: Version
        run: tools/version.sh > build-version && cat build-version
      # The build installs LXD, Snapcraft and the build snaps from the Snap
      # Store, which at times does not answer GitHub's runners; up to three
      # attempts, a minute apart.
      - uses: snapcore/action-build@v1
        id: build1
        continue-on-error: true
      - if: steps.build1.outcome == 'failure'
        run: sleep 60
      - uses: snapcore/action-build@v1
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
      - if: steps.build2.outcome == 'failure'
        run: sleep 60
      - uses: snapcore/action-build@v1
        id: build3
        if: steps.build2.outcome == 'failure'
      - uses: actions/upload-artifact@v4
        with:
          name: murmel-snap
          path: ${{ steps.build1.outputs.snap || steps.build2.outputs.snap || steps.build3.outputs.snap }}
          retention-days: 7
          if-no-files-found: error
