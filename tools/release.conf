# Release settings for tools/release.sh (sourced by bash).

# Public URL of the uploaded web/ folder (trailing slash).
WEB_URL="https://simon-tschoep.de/software/murmel/"

# Flatpak branch friends install and update from.
BRANCH="stable"

# GnuPG home holding the release signing key. Never inside the project:
# web/ is uploaded and the repository may be published.
GPG_HOME="$HOME/.local/share/murmel-release/gnupg"
GPG_KEY="E7A6662C9A63C5843E7454E4645C7A3F3151C443"

# Upload target and other machine-specific settings live in
# tools/release.local.conf (not in git), e.g.:
#
#   # SFTP location mounted through GVfs (GNOME Files); the password must
#   # be saved in the keyring so the script can remount it.
#   UPLOAD_HOST="sftp.example.org"
#   UPLOAD_PORT="22"
#   UPLOAD_USER="user"
#   UPLOAD_PATH="/htdocs/murmel"
#
# Without it, upload web/ to WEB_URL by hand.
