; murmur.ini — Murmel QA harness
;
; Mounted read-only at /etc/mumble/murmel.ini and selected via
; MUMBLE_CUSTOM_CONFIG_FILE in compose.yaml (while that variable is set, the
; image ignores all MUMBLE_CONFIG_* environment variables and uses this file
; as-is — no defaults are appended, so everything needed lives here).
;
; Gotchas verified against murmur 1.5 / the mumble-server image:
;   * There is no `servername` ini key — the name shown to clients is
;     `registerName` (the root channel's name).
;   * There is no `superuser_password` ini key — the SuperUser password is set
;     via MUMBLE_SUPERUSER_PASSWORD in compose.yaml (image runs `-supw`).

; SQLite database inside the container's /data volume.
database=/data/murmur.sqlite

welcometext="Murmel QA harness"

port=64738

; QA: room for a handful of bots + the client under test.
users=50

; Server name shown to clients (root channel name).
registerName=MurmelQA

; Never autoban: QA bots reconnect in rapid bursts.
autobanAttempts=0

; Empty = root channel (same as defaultchannel=0).
defaultchannel=

; 128 kbps is plenty for Opus voice and matches modern defaults.
bandwidth=128000

; 0 = Opus is always used; legacy CELT codecs are never negotiated.
opusthreshold=0
